{% extends "base.html" %}

{% block head %}
<link href="{{ url_for('static', filename='css/stock.css') }}?v=2" rel="stylesheet">
{% endblock %}

{% block content %}
<div id="stockRadar" class="sr" data-currency="{{ currency }}">

  <!-- ══ Command bar ══════════════════════════════════════════ -->
  <header class="sr-cmd">
    <div class="sr-cmd__sweep" aria-hidden="true"></div>
    <div class="sr-cmd__id">
      <div class="sr-cmd__mark"><i class="bi bi-radar"></i></div>
      <div class="sr-cmd__txt">
        <h1 class="sr-cmd__title">Stock Radar</h1>
        <p class="sr-cmd__sub">Inventory command center</p>
      </div>
    </div>
    <div class="sr-cmd__meta">
      <div class="sr-pos sr-pos--wait" id="srPos" title="Live POS feed">
        <span class="sr-pos__dot"></span><span class="sr-pos__txt">Connecting…</span>
      </div>
      <span class="sr-updated" id="srUpdated"></span>
      <button class="sr-btn sr-btn--ghost" id="srRefresh" title="Refresh (R)" aria-label="Refresh">
        <i class="bi bi-arrow-repeat"></i>
      </button>
      <button class="sr-btn sr-btn--gold" id="srAddToggle">
        <i class="bi bi-plus-lg"></i><span>Track item</span>
      </button>
      <a class="sr-btn sr-btn--solid" href="/stock/receive">
        <i class="bi bi-upload"></i><span>Receive invoice</span>
      </a>
    </div>
  </header>

  <!-- ══ Track-item panel (collapsible) ═══════════════════════ -->
  <section class="sr-add" id="srAdd" hidden>
    <div class="sr-add__bar">
      <div class="sr-search sr-search--lg">
        <i class="bi bi-search"></i>
        <input id="srAddSearch" placeholder="Search POS catalog by name or code…" autocomplete="off">
      </div>
      <select id="srAddSubgroup" class="sr-select"><option value="">All subgroups</option></select>
      <button class="sr-btn sr-btn--solid" id="srAddSearchBtn">Search</button>
      <button class="sr-btn sr-btn--ghost" id="srAddClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sr-add__results" id="srAddResults">
      <div class="sr-hint"><i class="bi bi-stars"></i> Search the POS catalog to start tracking an item.</div>
    </div>
  </section>

  <!-- ══ KPI tiles ════════════════════════════════════════════ -->
  <section class="sr-kpis" id="srKpis" aria-label="Inventory summary">
    <div class="sr-kpi sr-skel" style="height:104px"></div>
    <div class="sr-kpi sr-skel" style="height:104px"></div>
    <div class="sr-kpi sr-skel" style="height:104px"></div>
    <div class="sr-kpi sr-skel" style="height:104px"></div>
  </section>

  <!-- ══ Overview: radar + spotlight ══════════════════════════ -->
  <section class="sr-overview">
    <div class="sr-panel sr-radar" id="srRadar">
      <div class="sr-skel" style="height:200px;border-radius:var(--r-lg)"></div>
    </div>
    <div class="sr-panel sr-spot" id="srSpot">
      <div class="sr-skel" style="height:200px;border-radius:var(--r-lg)"></div>
    </div>
  </section>

  <!-- ══ Toolbar ══════════════════════════════════════════════ -->
  <section class="sr-toolbar">
    <div class="sr-filters" id="srFilters"></div>
    <div class="sr-tools">
      <div class="sr-search">
        <i class="bi bi-funnel"></i>
        <input id="srSearch" placeholder="Filter list…" autocomplete="off">
      </div>
      <select id="srSort" class="sr-select" aria-label="Sort">
        <option value="urgency">Urgency</option>
        <option value="cover">Days of cover</option>
        <option value="velocity">Velocity</option>
        <option value="live">Live qty</option>
        <option value="value">Value</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
  </section>

  <!-- ══ Item list ════════════════════════════════════════════ -->
  <section class="sr-list" id="srList">
    <div class="sr-skel" style="height:64px"></div>
    <div class="sr-skel" style="height:64px"></div>
    <div class="sr-skel" style="height:64px"></div>
  </section>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/stock.js') }}?v=2"></script>
{% endblock %}
